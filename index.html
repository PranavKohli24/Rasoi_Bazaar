    <style>
       html .font-serif { font-family: 'Fraunces', ui-serif, Georgia, serif; }
      html .font-sans  { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
      html .font-hand  { font-family: 'Caveat', cursive; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Lato', sans-serif;
        background-color: #1c1b17;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      .font-serif {
        font-family: 'Merriweather', serif;
        letter-spacing: -0.02em;
      }
      .prose ol > li::marker {
          font-weight: 700;
          color: #f97316; /* text-orange-500 */
      }

      /* --- Background Animation --- */
      #background-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(ellipse at top, #2c2420, #1a1614 60%);
      }


      @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.7s ease-out forwards;
      }
      
      /* --- Celebration Sparkles --- */
      @keyframes sparkle-animation {
        0% {
          transform: scale(0) rotate(0deg);
          opacity: 1;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: scale(1.5) rotate(180deg);
          opacity: 0;
        }
      }
      .celebration-popup .sparkle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        animation: sparkle-animation 1s ease-out forwards;
      }

      /* --- Custom Scrollbar --- */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.18);
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(234, 88, 12, 0.8);
      }


      /* Keep Chrome autofill dark */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-text-fill-color: #f5f5f4 !important;
        -webkit-box-shadow: 0 0 0 1000px #1c1917 inset !important;
        box-shadow: 0 0 0 1000px #1c1917 inset !important;
        caret-color: #f5f5f4;
        transition: background-color 9999s ease-in-out 0s;
      }

      @media (prefers-reduced-motion: reduce) {
        #background-animation {
          animation: none;
        }
        .animate-fade-in-up {
          animation: fadeInUp 0.01ms linear forwards;
        }
        .celebration-popup .sparkle {
          animation: none;
          opacity: 0;
        }
        * {
          scroll-behavior: auto !important;
        }
      }


     .cook-note {
  font-family: 'Caveat', cursive;

  font-weight: 600;
  transform: rotate(-5deg);
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 8px rgba(255, 224, 180, 0.08);

  margin-left: 22px;
}

.cook-note-arrow {
  width: 68px;
  height: 48px;
  overflow: visible;
  margin-top: 12px;
  margin-left: -72px;
  transform: rotate(20deg);
}

.cook-note-arrow path {
  fill: none;
  stroke: rgba(255, 235, 205, 0.78);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
