<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rasoi Bazaar background tile: hand-drawn style food, fruit and kitchen doodles.
       Transparent, seamless, one warm colour. Tweak stroke-opacity to make it fainter or stronger. -->
  <g fill="none" stroke="#C9722E" stroke-opacity="0.2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <!-- Row 1 -->
    <g transform="translate(16 14) rotate(-10 20 20)"><!-- tomato -->
      <circle cx="20" cy="23" r="13"/><path d="M13 12l7 5 7-5M20 17V9"/><path d="M20 9c2-3 5-3 7-2"/>
    </g>
    <g transform="translate(102 20) rotate(15 20 20)"><!-- lemon -->
      <ellipse cx="20" cy="20" rx="15" ry="10.5"/><path d="M4 24l-3 2M36 16l3-2"/><path d="M12 17c3-3 8-4 12-3"/>
    </g>
    <g transform="translate(178 10) rotate(4 20 20)"><!-- pot -->
      <path d="M6 18h28v10a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/><path d="M6 22H1M34 22h5"/><path d="M9 13h22"/><path d="M17 13a3 3 0 0 1 6 0"/>
    </g>
    <g transform="translate(258 14) rotate(-8 20 20)"><!-- onion -->
      <path d="M20 8c0 5-12 9-12 18a12 12 0 0 0 24 0c0-9-12-13-12-18z"/><path d="M20 8V3M14 17c-2 4-2 9 0 13M26 17c2 4 2 9 0 13"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(28 96) rotate(12 20 20)"><!-- apple -->
      <path d="M20 12c-7-5-15 0-13 10 1 8 6 14 13 12 7 2 12-4 13-12 2-10-6-15-13-10z"/><path d="M20 12c0-4 2-7 6-8"/>
    </g>
    <g transform="translate(102 102) rotate(-20 20 20)"><!-- rolling pin -->
      <rect x="9" y="14" width="22" height="11" rx="4"/><path d="M2 19.5h7M31 19.5h7"/>
    </g>
    <g transform="translate(186 92) rotate(8 20 20)"><!-- garlic -->
      <path d="M20 4c-2 5-12 9-12 19a12 12 0 0 0 24 0c0-10-10-14-12-19z"/><path d="M20 9v25M13 17c-2 5-1 11 3 16M27 17c2 5 1 11-3 16"/>
    </g>
    <g transform="translate(262 98) rotate(-6 20 20)"><!-- mortar and pestle -->
      <path d="M5 20h30c0 10-6 17-15 17S5 30 5 20z"/><path d="M22 20L33 4"/><path d="M31 6l4 3"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20 174) rotate(-15 20 20)"><!-- carrot -->
      <path d="M24 12c4 4 5 9-1 14L7 36l3-19c4-6 10-8 14-5z"/><path d="M24 12l6-7M24 12l9 1M24 12l1-9"/><path d="M14 22l4 1M12 28l4 1"/>
    </g>
    <g transform="translate(106 182) rotate(6 20 20)"><!-- watermelon slice -->
      <path d="M3 18a17 17 0 0 0 34 0z"/><path d="M8 18a12 12 0 0 0 24 0"/><path d="M13 24v.1M20 27v.1M27 24v.1"/>
    </g>
    <g transform="translate(184 176) rotate(-12 20 20)"><!-- chilli -->
      <path d="M8 8c9-3 20 2 24 13 2 6 5 9 8 10-11 4-26 0-30-15z"/><path d="M8 8c-2-2-2-5 1-6"/>
    </g>
    <g transform="translate(262 172) rotate(10 20 20)"><!-- ladle -->
      <path d="M4 36L24 14"/><circle cx="29" cy="9" r="7"/><path d="M25 9h8"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(16 254)"><!-- tawa -->
      <circle cx="17" cy="20" r="14"/><circle cx="17" cy="20" r="9"/><path d="M31 20h9"/>
    </g>
    <g transform="translate(108 258) rotate(-15 20 20)"><!-- apple (turned) -->
      <path d="M20 12c-7-5-15 0-13 10 1 8 6 14 13 12 7 2 12-4 13-12 2-10-6-15-13-10z"/><path d="M20 12c0-4 2-7 6-8"/>
    </g>
    <g transform="translate(190 252) rotate(10 20 20)"><!-- onion (turned) -->
      <path d="M20 8c0 5-12 9-12 18a12 12 0 0 0 24 0c0-9-12-13-12-18z"/><path d="M20 8V3M14 17c-2 4-2 9 0 13M26 17c2 4 2 9 0 13"/>
    </g>
    <g transform="translate(266 256) rotate(12 20 20)"><!-- lemon (turned) -->
      <ellipse cx="20" cy="20" rx="15" ry="10.5"/><path d="M4 24l-3 2M36 16l3-2"/><path d="M12 17c3-3 8-4 12-3"/>
    </g>
  </g>

  <!-- tiny seeds / spice dots between the drawings -->
  <g fill="#C9722E" fill-opacity="0.22">
    <circle cx="82" cy="72" r="1.6"/><circle cx="160" cy="74" r="1.4"/><circle cx="238" cy="70" r="1.6"/>
    <circle cx="70" cy="156" r="1.4"/><circle cx="150" cy="150" r="1.6"/><circle cx="246" cy="148" r="1.4"/>
    <circle cx="86" cy="232" r="1.6"/><circle cx="168" cy="236" r="1.4"/><circle cx="246" cy="230" r="1.6"/>
    <circle cx="66" cy="304" r="1.4"/><circle cx="150" cy="306" r="1.6"/><circle cx="236" cy="304" r="1.4"/>
  </g>
</svg>
